plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	compileOnly "org.spongepowered:mixin:0.8.7"

	// Loom's Minecraft jar annotates client-only classes with
	// @net.fabricmc.api.Environment(EnvType.CLIENT). Without fabric-loader on the compile
	// classpath javac cannot resolve that enum and emits "unknown enum constant
	// EnvType.CLIENT" once per annotated class it loads. compileOnly keeps it out of the
	// runtime classpath and out of the published jars, so :neoforge is unaffected - this
	// only gives javac the annotation classes it is already being asked to read.
	compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"

	// The canvas, brush, codec, config and rate-limiter layers deliberately contain no
	// Minecraft classes, so they can be tested in a plain JVM with no game bootstrap.
	// Everything that needs a live game stays out of these tests by construction.
	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
